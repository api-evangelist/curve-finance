  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://etherscan.io/address/curve.fi
  humanURL: https://docs.curve.finance/
  description: >-
    Curve's primary surface for swaps and liquidity is a set of audited Vyper smart contracts deployed
    across multiple chains (StableSwap and CryptoSwap pools, factories, gauges, voting escrow, crvUSD,
    lending markets).
  properties:
  - type: Documentation
    url: https://docs.curve.finance/
  - type: GitHub
    url: https://github.com/curvefi/curve-contract
  x-features:
  - StableSwap and CryptoSwap pools
  - Factory pools and gauges
  - veCRV voting escrow
  - crvUSD stablecoin
  - Lending markets
  x-use-cases:
  - On-chain swap execution
  - Liquidity provisioning
  - Governance voting
