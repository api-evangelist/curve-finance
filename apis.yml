description: Curve Finance is a DeFi automated market maker (AMM) optimized for low-slippage
  swaps among stablecoins and pegged assets across multiple chains. Curve maintains
  a public read-only REST API at api.curve.finance providing pool, gauge, factory,
  governance, lending, crvUSD, and TVL data. Smart-contract entry points are the primary
  write path; the REST API is for indexing and analytics.
apis:
- aid: curve-finance:rest-api
  name: Curve REST API
  tags:
  - Pools
  - Gauges
  - TVL
  - Lending
  - crvUSD
  - Governance
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.curve.finance/api
  humanURL: https://docs.curve.finance/curve-api/curve-api/
  description: >-
    Public read-only REST API used by the Curve UI and third parties. Endpoints cover /getPools/all, /getSubgraphData,
    /getFactoryAPYs, /getLendingVaults, /getCrvUsdData, and similar. JSON output. No authentication or
    rate limiting at the documented level.
  properties:
  - type: Documentation
    url: https://docs.curve.finance/curve-api/curve-api/
  - type: GitHub
    url: https://github.com/curvefi/curve-api
  - url: graphql/curve-finance-graphql.md
    type: GraphQL
  x-features:
  - Pool, gauge, factory, lending, crvUSD endpoints
  - Multi-chain (Ethereum, Arbitrum, Optimism, Polygon, Avalanche, etc.)
  - JSON read-only
  x-use-cases:
  - Indexing Curve liquidity for analytics
  - Building Curve dashboards
  - Pool APY calculators
- aid: curve-finance:smart-contracts
  name: Curve Smart Contracts
  tags:
  - Smart Contracts
